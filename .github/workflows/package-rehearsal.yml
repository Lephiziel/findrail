name: Package rehearsal (no release)
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact commit SHA to rehearse
        required: true
        type: string
      candidate_version:
        description: Explicit unpublished candidate version
        required: true
        default: 0.1.0-beta.1
        type: string
permissions:
  contents: read
jobs:
  packaged-native:
    env:
      CANDIDATE_VERSION: ${{ github.event_name == 'pull_request' && '0.1.0-beta.1' || inputs.candidate_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: windows-amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Read the repository's preparation candidate selector
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat build/package/CANDIDATE_VERSION)
          test "$version" = 0.1.0-beta.1
          echo "CANDIDATE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build candidate archive through production packager
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
        run: |
          PYTHON=python3
          if [[ '${{ runner.os }}' == Windows ]]; then PYTHON=python; fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          VERSION="$CANDIDATE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$VERSION" = 0.1.0-alpha.5 -o "$VERSION" = 0.1.0-beta.1
            MAIN_SHA=$(git ls-remote https://github.com/Lephiziel/findrail.git refs/heads/main | cut -f1)
            test "$CANDIDATE_SHA" = "$MAIN_SHA"
          fi
          [[ "$VERSION" == 0.1.0-alpha.5 || "$VERSION" == 0.1.0-beta.1 ]]
          "$PYTHON" scripts/package.py --version "$VERSION" --require-clean --target '${{ matrix.target }}' --output "$RUNNER_TEMP/findrail-candidate"
      - name: Verify candidate checksum manifest
        shell: bash
        run: |
          PYTHON=python3
          if [[ '${{ runner.os }}' == Windows ]]; then PYTHON=python; fi
          "$PYTHON" scripts/package.py --verify-only --output "$RUNNER_TEMP/findrail-candidate"
      - name: Extract and smoke tested archive
        shell: bash
        run: |
          PYTHON=python3
          if [[ '${{ runner.os }}' == Windows ]]; then PYTHON=python; fi
          "$PYTHON" - "$RUNNER_TEMP/findrail-candidate" "$RUNNER_TEMP/install 📦" <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          d, target = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          archive = next(p for p in d.iterdir() if p.name.endswith(('.zip', '.tar.gz')))
          version = os.environ['CANDIDATE_VERSION']
          expected = f'findrail_{version}_${{ matrix.target }}'
          if archive.name != expected + ('.zip' if archive.suffix == '.zip' else '.tar.gz'): raise SystemExit('unexpected archive name')
          package.verify_archive(archive, '${{ matrix.target }}', version)
          root = package.extract_verified(archive, target)
          import json
          info = json.loads((root / 'BUILD-INFO.json').read_text())
          if info['version'] != version or info['target'] != '${{ matrix.target }}' or info['revision'] != '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}' or info['dirty'] is not False:
              raise SystemExit('candidate metadata mismatch')
          binary = root / ('findrail.exe' if 'windows' in archive.name else 'findrail')
          if not binary.is_file(): raise SystemExit('extracted executable missing')
          PY
          if [[ '${{ matrix.target }}' == windows-* ]]; then
            BINARY="$RUNNER_TEMP/install 📦/findrail_${CANDIDATE_VERSION}_${{ matrix.target }}/findrail.exe"
          else
            BINARY="$RUNNER_TEMP/install 📦/findrail_${CANDIDATE_VERSION}_${{ matrix.target }}/findrail"
          fi
          "$PYTHON" scripts/smoke.py --expected-version "$CANDIDATE_VERSION" "$BINARY"
          "$PYTHON" scripts/search_smoke.py "$BINARY"
          "$PYTHON" scripts/mcp_smoke.py "$BINARY"
          "$PYTHON" scripts/portable_smoke.py "$BINARY"
          "$PYTHON" scripts/diagnostics_smoke.py "$BINARY"
          if [[ '${{ matrix.target }}' == windows-* ]]; then
            DESKTOP="$RUNNER_TEMP/install 📦/findrail_${CANDIDATE_VERSION}_${{ matrix.target }}/findrail-desktop.exe"
            test "$("$DESKTOP" version)" = "findrail $CANDIDATE_VERSION"
          fi
          "$PYTHON" scripts/desktop_launch_smoke.py "$BINARY"
          ARCHIVE=$(find "$RUNNER_TEMP/findrail-candidate" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)
          "$PYTHON" scripts/installer_lifecycle_smoke.py "$ARCHIVE" --candidate-sha '${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}' --report "$RUNNER_TEMP/install-lifecycle.json"
      - name: Download and verify immutable published alpha.3 reference archive
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/findrail_0.1.0-alpha.3_linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.3/findrail_0.1.0-alpha.3_linux-amd64.tar.gz -o "$archive"
          echo 'b8e9d606e6487745a9f96d4453114e7ef6ec74fcde242a7da20a059462b3b9e9  '"$archive" | sha256sum --check --status
          python3 - "$archive" "$RUNNER_TEMP/alpha3-reference" <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.3', 6)
          package.extract_verified(archive, out)
          PY
      - name: Download and verify published alpha.5 same-schema reference
        if: matrix.target == 'linux-amd64' && env.CANDIDATE_VERSION == '0.1.0-beta.1'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/findrail_0.1.0-alpha.5_linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.5/findrail_0.1.0-alpha.5_linux-amd64.tar.gz -o "$archive"
          echo '78885728107e26be6db18f93c0f94ee6af92b585f00aea21dd93ba9e19a5a8f0  '"$archive" | sha256sum --check --status
          python3 - "$archive" "$RUNNER_TEMP/alpha5-reference" <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.5', 8)
          root = package.extract_verified(archive, out)
          import json
          info = json.loads((root / 'BUILD-INFO.json').read_text(encoding='utf-8'))
          if (info.get('revision'), info.get('version'), info.get('schema_version'), info.get('dirty')) != ('cb53ee9638f69b47b386921e41368f3b66ceddde', '0.1.0-alpha.5', 8, False):
              raise SystemExit('published alpha.5 reference provenance mismatch')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ALPHA5_BINARY={root / "findrail"}\n')
          PY
          python3 scripts/upgrade_smoke.py "$RUNNER_TEMP/install 📦/findrail_${CANDIDATE_VERSION}_linux-amd64/findrail" --alpha5-binary "$RUNNER_TEMP/alpha5-reference/findrail_0.1.0-alpha.5_linux-amd64/findrail" --alpha5-only
      - name: Rehearse alpha.2 and published alpha.3 upgrades and stopped-backup restores
        if: matrix.target == 'linux-amd64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/findrail_0.1.0-alpha.4_linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.4/findrail_0.1.0-alpha.4_linux-amd64.tar.gz -o "$archive"
          echo '41f91c62b618a64dc083f7a63403f7f4fcc6f8b13ffb613acfee6704927f6a1a  '"$archive" | sha256sum --check --status
          python3 - "$archive" "$RUNNER_TEMP/alpha4-reference" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.4', 7)
          package.extract_verified(archive, out)
          PY
          ALPHA4_BINARY="$RUNNER_TEMP/alpha4-reference/findrail_0.1.0-alpha.4_linux-amd64/findrail"
          test -x "$ALPHA4_BINARY"
          python3 scripts/upgrade_smoke.py "$RUNNER_TEMP/install 📦/findrail_${CANDIDATE_VERSION}_linux-amd64/findrail" \
            --alpha3-binary "$RUNNER_TEMP/alpha3-reference/findrail_0.1.0-alpha.3_linux-amd64/findrail" \
            --alpha4-binary "$ALPHA4_BINARY"
      - name: Save candidate archive and verification report
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-evidence"
          if [[ -f "$RUNNER_TEMP/install-lifecycle.json" ]]; then cp "$RUNNER_TEMP/install-lifecycle.json" "$RUNNER_TEMP/release-evidence/"; fi
          if [[ -d "$RUNNER_TEMP/findrail-candidate" ]]; then cp "$RUNNER_TEMP/findrail-candidate"/* "$RUNNER_TEMP/release-evidence/" 2>/dev/null || true; fi
          PYTHON=python3; if [[ '${{ runner.os }}' == Windows ]]; then PYTHON=python; fi
          "$PYTHON" - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-evidence'/'verification.json'
          checks=['archive_checksum','archive_contents','exact_build_info','executable_version','cli','search','browser_api','mcp','portable_snapshot','diagnostics','desktop_single_owner','launcher_pdf_child']
          if '${{ matrix.target }}' == 'linux-amd64':
            checks.extend(['alpha2_schema2_upgrade_restore','alpha3_schema6_upgrade_restore','published_alpha4_schema7_to_schema8_saved_collection_restore_rollback'])
            if os.environ['CANDIDATE_VERSION'] == '0.1.0-beta.1': checks.append('published_alpha5_schema8_same_schema_compatibility')
          p.write_text(json.dumps({'candidate_sha': os.environ['CANDIDATE_SHA'], 'candidate_version':os.environ['CANDIDATE_VERSION'], 'schema_version':package.schema_version(), 'target':'${{ matrix.target }}', 'source_clean':os.environ['JOB_STATUS']=='success', 'status':os.environ['JOB_STATUS'],'checks':checks if os.environ['JOB_STATUS']=='success' else []}, sort_keys=True, indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
