name: Reusable release asset verification
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      candidate_version:
        required: true
        type: string
jobs:
  verify-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}/release-assets
      - name: Verify exact set against caller candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/release_assets.py verify --directory "$RUNNER_TEMP/release-assets" --version "$CANDIDATE_VERSION" --revision "$CANDIDATE_SHA"
