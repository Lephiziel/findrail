name: Alpha release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Read and validate version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('build/package/VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
          PY
      - name: Check whether the prerelease already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_error="$RUNNER_TEMP/findrail-release-query.err"
          tag_error="$RUNNER_TEMP/findrail-tag-query.err"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>"$release_error"
          release_status=$?
          set -e
          if [[ $release_status -eq 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            exit 0
          elif ! grep -q 'HTTP 404' "$release_error"; then
            cat "$release_error" >&2
            echo 'Could not determine whether release exists; refusing publication.' >&2
            exit 1
          fi
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>"$tag_error"
          tag_status=$?
          set -e
          if [[ $tag_status -eq 0 ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' "$tag_error"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat "$tag_error" >&2
            echo 'Could not determine whether tag exists; refusing publication.' >&2
            exit 1
          fi
      - name: Build archives and license notices
        if: steps.existing.outputs.exists == 'false'
        run: python3 scripts/package.py --require-clean
      - name: Smoke test the packaged Linux executable
        if: steps.existing.outputs.exists == 'false'
        run: |
          python3 scripts/package.py --verify-only --output dist
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          version = pathlib.Path('build/package/VERSION').read_text().strip()
          archive = pathlib.Path('dist') / f'findrail_{version}_linux-amd64.tar.gz'
          package.verify_archive(archive, 'linux-amd64', version)
          root = package.extract_verified(archive, pathlib.Path('/tmp/findrail-release-smoke'))
          print(root / 'findrail')
          PY
          VERSION=$(cat build/package/VERSION)
          python3 scripts/smoke.py "/tmp/findrail-release-smoke/findrail_${VERSION}_linux-amd64/findrail"
          python3 scripts/mcp_smoke.py "/tmp/findrail-release-smoke/findrail_${VERSION}_linux-amd64/findrail"
      - name: Publish alpha archives
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          mapfile -t files < <(python3 scripts/package.py --verify-only --output dist)
          assets=()
          for file in "${files[@]}"; do assets+=("dist/$file"); done
          assets+=(dist/SHA256SUMS.txt)
          gh release create "$TAG" "${assets[@]}" --target "$COMMIT" --prerelease --title "Findrail $TAG" --notes-file docs/release-notes.md
