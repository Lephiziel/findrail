name: Alpha release candidate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main commit to package; use for preview/rehearsal
        required: true
        type: string
      candidate_version:
        description: Preview package version (ignored for main push; must match VERSION to publish)
        required: true
        default: 0.1.0-alpha.5
        type: string
      publish:
        description: Publish only if every gate passes (normally leave false for preparation)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: alpha-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate-source:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      release_version: ${{ steps.source.outputs.release_version }}
      publish: ${{ steps.source.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - id: source
        env:
          INPUT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || '' }}
          REQUEST_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INPUT_SHA"
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then test "$INPUT_SHA" = "$GITHUB_SHA"; fi
          if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            echo "Unsupported release upstream event: $GITHUB_EVENT_NAME" >&2; exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" != pull_request && ( "$GITHUB_REPOSITORY" != 'Lephiziel/findrail' || "$GITHUB_REF" != 'refs/heads/main' ) ]]; then
            echo 'Publication/dispatch requires the canonical repository main branch.' >&2; exit 1
          fi
          RELEASE_VERSION=$(cat build/package/VERSION)
          VERSION="$RELEASE_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == push ]]; then VERSION=0.1.0-alpha.5; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then VERSION="$INPUT_VERSION"; fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          PUBLISH=false
          if [[ "$GITHUB_EVENT_NAME" == push || "$REQUEST_PUBLISH" == true ]]; then PUBLISH=true; fi
          if [[ "$REQUEST_PUBLISH" == true && "$VERSION" != "$RELEASE_VERSION" ]]; then
            echo 'Publishing requires candidate_version to match build/package/VERSION.' >&2; exit 1
          fi
          {
            echo "sha=$INPUT_SHA"
            echo "version=$VERSION"
            echo "release_version=$RELEASE_VERSION"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"
  source-checks:
    needs: validate-source
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.validate-source.outputs.candidate_sha }}
  native-packages:
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-amd64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-14
          - target: windows-amd64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Build on native target with exact provenance
        shell: bash
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
          CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          PY=python3; [[ '${{ runner.os }}' != Windows ]] || PY=python
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          "$PY" scripts/package.py --version "$VERSION" --require-clean --target '${{ matrix.target }}' --output "$RUNNER_TEMP/candidate"
          "$PY" scripts/package.py --verify-only --output "$RUNNER_TEMP/candidate"
          "$PY" - "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/install space 📦" "$VERSION" "$CANDIDATE_SHA" '${{ matrix.target }}' <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          source, destination, version, revision, target = map(pathlib.Path, sys.argv[1:])
          version, revision, target = str(version), str(revision), str(target)
          archive = next(p for p in source.iterdir() if p.name.endswith(('.zip', '.tar.gz')))
          package.verify_archive(archive, target, version)
          extracted = package.extract_verified(archive, destination)
          info = json.loads((extracted / 'BUILD-INFO.json').read_text(encoding='utf-8'))
          if (info.get('revision'), info.get('dirty'), info.get('version'), info.get('target')) != (revision, False, version, target):
              raise SystemExit('candidate BUILD-INFO provenance mismatch')
          binary = extracted / ('findrail.exe' if target.startswith('windows-') else 'findrail')
          (destination.parent / 'verified-binary-path.txt').write_text(str(binary), encoding='utf-8')
          PY
          BINARY="$RUNNER_TEMP/install space 📦/findrail_${VERSION}_${{ matrix.target }}/findrail"
          [[ '${{ matrix.target }}' != windows-* ]] || BINARY="$RUNNER_TEMP/install space 📦/findrail_${VERSION}_${{ matrix.target }}/findrail.exe"
          "$PY" scripts/smoke.py --expected-version "$VERSION" "$BINARY"
          "$PY" scripts/search_smoke.py "$BINARY"
          "$PY" scripts/mcp_smoke.py "$BINARY"
          "$PY" scripts/portable_smoke.py "$BINARY"
          "$PY" scripts/diagnostics_smoke.py "$BINARY"
          if [[ '${{ matrix.target }}' == windows-* ]]; then
            DESKTOP="$RUNNER_TEMP/install space 📦/findrail_${VERSION}_${{ matrix.target }}/findrail-desktop.exe"
            test "$("$DESKTOP" version)" = "findrail $VERSION"
          fi
          "$PY" scripts/desktop_launch_smoke.py "$BINARY"
          ARCHIVE=$(find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print -quit)
          "$PY" scripts/installer_lifecycle_smoke.py "$ARCHIVE" --candidate-sha '${{ needs.validate-source.outputs.candidate_sha }}' --report "$RUNNER_TEMP/install-lifecycle.json"
          if [[ '${{ matrix.target }}' == linux-amd64 ]]; then
            FINDRAIL_MCP_TEST_BINARY="$BINARY" go test -count=1 -v ./internal/cli -run '^TestGeneratedMCPConfigSDKJourney$'
            REFERENCE="$RUNNER_TEMP/alpha3-reference"
            ALPHA3_ARCHIVE="$RUNNER_TEMP/findrail_0.1.0-alpha.3_linux-amd64.tar.gz"
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.3/findrail_0.1.0-alpha.3_linux-amd64.tar.gz -o "$ALPHA3_ARCHIVE"
            echo 'b8e9d606e6487745a9f96d4453114e7ef6ec74fcde242a7da20a059462b3b9e9  '"$ALPHA3_ARCHIVE" | sha256sum --check --status
            "$PY" - "$ALPHA3_ARCHIVE" "$REFERENCE" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.3', 6)
          package.extract_verified(archive, out)
          PY
            ALPHA4_ARCHIVE="$RUNNER_TEMP/findrail_0.1.0-alpha.4_linux-amd64.tar.gz"
            curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
              https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.4/findrail_0.1.0-alpha.4_linux-amd64.tar.gz -o "$ALPHA4_ARCHIVE"
            echo '41f91c62b618a64dc083f7a63403f7f4fcc6f8b13ffb613acfee6704927f6a1a  '"$ALPHA4_ARCHIVE" | sha256sum --check --status
            "$PY" - "$ALPHA4_ARCHIVE" "$RUNNER_TEMP/alpha4-reference" <<'PY'
          import pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.4', 7)
          package.extract_verified(archive, out)
          PY
            "$PY" scripts/upgrade_smoke.py "$BINARY" \
              --alpha3-binary "$REFERENCE/findrail_0.1.0-alpha.3_linux-amd64/findrail" \
              --alpha4-binary "$RUNNER_TEMP/alpha4-reference/findrail_0.1.0-alpha.4_linux-amd64/findrail"
            "$PY" scripts/search_resource_check.py \
              --binary "$BINARY" \
              --compare "$RUNNER_TEMP/alpha4-reference/findrail_0.1.0-alpha.4_linux-amd64/findrail" \
              --documents 100 --seed 42 --queries 2 \
              --report "$RUNNER_TEMP/alpha5-resource-comparison.json"
            BASELINE_SHA=6b157fe3a6fe2f3f3808732ce72a8e74a118f763
            git fetch --no-tags https://github.com/Lephiziel/findrail.git "$BASELINE_SHA"
            git worktree add --detach "$RUNNER_TEMP/source-baseline" "$BASELINE_SHA"
            "$PY" "$RUNNER_TEMP/source-baseline/scripts/package.py" --version 0.1.0-alpha.5 --require-clean \
              --target linux-amd64 --output "$RUNNER_TEMP/source-baseline-archive"
            "$PY" - "$RUNNER_TEMP/source-baseline-archive" "$RUNNER_TEMP/baseline install 📦" "$BASELINE_SHA" <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive=pathlib.Path(sys.argv[1])/'findrail_0.1.0-alpha.5_linux-amd64.tar.gz'
          package.verify_manifest(archive.parent)
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.5')
          root=package.extract_verified(archive,pathlib.Path(sys.argv[2]))
          info=json.loads((root/'BUILD-INFO.json').read_text())
          assert info['revision']==sys.argv[3] and info['dirty'] is False
          PY
            "$PY" scripts/search_resource_check.py --binary "$BINARY" \
              --compare "$RUNNER_TEMP/baseline install 📦/findrail_0.1.0-alpha.5_linux-amd64/findrail" \
              --documents 100 --seed 42 --queries 2 --report "$RUNNER_TEMP/source-baseline-resource-comparison.json"
            "$PY" scripts/search_resource_check.py --binary "$BINARY" --documents 1000 --seed 42 --queries 2 \
              --source-cycle-boundaries --report "$RUNNER_TEMP/source-cycle-resource-boundaries.json"
            "$PY" scripts/portable_resource_check.py "$BINARY" > "$RUNNER_TEMP/snapshot-resource-boundary.json"
          fi
      - name: Save verification result and archive
        if: always()
        shell: bash
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
          CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
          JOB_STATUS: ${{ job.status }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-evidence"
          if [[ -d "$RUNNER_TEMP/candidate" ]]; then
            find "$RUNNER_TEMP/candidate" -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} "$RUNNER_TEMP/release-evidence/" \;
          fi
          for report in "$RUNNER_TEMP"/*resource*.json; do
            if [[ -f "$report" ]]; then cp "$report" "$RUNNER_TEMP/release-evidence/"; fi
          done
          if [[ -f "$RUNNER_TEMP/install-lifecycle.json" ]]; then cp "$RUNNER_TEMP/install-lifecycle.json" "$RUNNER_TEMP/release-evidence/install-lifecycle-${TARGET}.json"; fi
          PY=python3; [[ '${{ runner.os }}' != Windows ]] || PY=python
          "$PY" scripts/candidate_record.py native --native-directory "$RUNNER_TEMP/release-evidence" \
            --candidate-sha "$CANDIDATE_SHA" --candidate-version "$VERSION" --target "$TARGET" \
            --status "$JOB_STATUS" --report "$RUNNER_TEMP/release-evidence/verification.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-package-${{ needs.validate-source.outputs.candidate_sha }}-${{ matrix.target }}
          path: ${{ runner.temp }}/release-evidence/
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
  installed-vsix:
    needs: [validate-source, native-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - working-directory: extensions/vscode
        run: npm ci --ignore-scripts
      - working-directory: extensions/vscode
        run: npm run typecheck
      - working-directory: extensions/vscode
        run: npm test
      - working-directory: extensions/vscode
        run: npm run test:integration
      - run: go test ./internal/transport/http/...
      - uses: actions/download-artifact@v8
        with:
          name: release-package-${{ needs.validate-source.outputs.candidate_sha }}-linux-amd64
          path: ${{ runner.temp }}/native-client
      - name: Safely extract the exact native candidate
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-client'
          version = os.environ['VERSION']
          archive = source / f'findrail_{version}_linux-amd64.tar.gz'
          package.verify_archive(archive, 'linux-amd64', version)
          root = package.extract_verified(archive, pathlib.Path(os.environ['RUNNER_TEMP']) / 'installed client 📦')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'FINDRAIL_CANDIDATE_BINARY={root / "findrail"}\n')
          PY
      - name: Package the VSIX
        working-directory: extensions/vscode
        run: npm run package
      - name: Test installed VSIX against the extracted candidate in an isolated profile
        working-directory: extensions/vscode
        env:
          FINDRAIL_TEST_VSIX: ${{ github.workspace }}/extensions/vscode/findrail-readonly-0.1.0.vsix
          FINDRAIL_CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
          FINDRAIL_CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
        run: xvfb-run -a node test/run-host.cjs
      - name: Assert VSIX contract and save
        run: |
          set -euo pipefail
          test -f extensions/vscode/findrail-readonly-0.1.0.vsix
          unzip -Z1 extensions/vscode/findrail-readonly-0.1.0.vsix | grep -qx 'extension/package.json'
          mkdir -p "$RUNNER_TEMP/vsix"
          cp extensions/vscode/findrail-readonly-0.1.0.vsix "$RUNNER_TEMP/vsix/"
      - uses: actions/upload-artifact@v7
        with:
          name: release-vsix-${{ needs.validate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/vsix/findrail-readonly-0.1.0.vsix
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  packaged-browser-journey:
    needs: [validate-source, native-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
      CANDIDATE_VERSION: ${{ needs.validate-source.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - uses: actions/download-artifact@v8
        with:
          name: release-package-${{ env.CANDIDATE_SHA }}-linux-amd64
          path: ${{ runner.temp }}/native-browser
      - name: Safely extract the previously built Linux candidate
        run: |
          python3 - <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-browser'
          version = os.environ['CANDIDATE_VERSION']
          archive = source / f'findrail_{version}_linux-amd64.tar.gz'
          package.verify_archive(archive, 'linux-amd64', version)
          root = package.extract_verified(archive, pathlib.Path(os.environ['RUNNER_TEMP']) / 'browser install 📦')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write(f'CANDIDATE_DIR={root}\n')
          PY
      - name: Fetch pinned published alpha.3 for the stopped-backup restore check
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/findrail_0.1.0-alpha.3_linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.3/findrail_0.1.0-alpha.3_linux-amd64.tar.gz -o "$ARCHIVE"
          echo 'b8e9d606e6487745a9f96d4453114e7ef6ec74fcde242a7da20a059462b3b9e9  '"$ARCHIVE" | sha256sum --check --status
          python3 - "$ARCHIVE" "$RUNNER_TEMP/alpha3-reference" <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.3', 6)
          root = package.extract_verified(archive, out)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ALPHA3_BINARY={root / "findrail"}\n')
          PY
      - name: Fetch pinned published alpha.4 for the schema-7 restore/migration check
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/findrail_0.1.0-alpha.4_linux-amd64.tar.gz"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            https://github.com/Lephiziel/findrail/releases/download/v0.1.0-alpha.4/findrail_0.1.0-alpha.4_linux-amd64.tar.gz -o "$archive"
          echo '41f91c62b618a64dc083f7a63403f7f4fcc6f8b13ffb613acfee6704927f6a1a  '"$archive" | sha256sum --check --status
          python3 - "$archive" "$RUNNER_TEMP/alpha4-reference" <<'PY'
          import os, pathlib, sys
          sys.path.insert(0, 'scripts')
          import package
          archive, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          package.verify_archive(archive, 'linux-amd64', '0.1.0-alpha.4', 7)
          root = package.extract_verified(archive, out)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write(f'ALPHA4_BINARY={root / "findrail"}\n')
          PY
      - name: Install pinned matched Chromium and driver
        run: |
          python3 -m pip install --disable-pip-version-check 'selenium==4.35.0'
          npm install --global --ignore-scripts '@puppeteer/browsers@2.10.6'
          npx --yes @puppeteer/browsers@2.10.6 install chrome@139.0.7258.66 --path "$RUNNER_TEMP/chrome-for-testing"
          npx --yes @puppeteer/browsers@2.10.6 install chromedriver@139.0.7258.66 --path "$RUNNER_TEMP/chrome-for-testing"
      - name: Prepare the offline synthetic GitHub fixture writer (not the application)
        run: go build -o "$RUNNER_TEMP/evidence-collection-fixture" ./scripts/evidence_collection_fixture.go
      - name: Fresh start, UI folder, evidence export, restart, and upgrade on the candidate
        env:
          FINDRAIL_CHROME: ${{ runner.temp }}/chrome-for-testing/chrome/linux-139.0.7258.66/chrome-linux64/chrome
          FINDRAIL_CHROMEDRIVER: ${{ runner.temp }}/chrome-for-testing/chromedriver/linux-139.0.7258.66/chromedriver-linux64/chromedriver
        run: python3 scripts/packaged_journey.py "$CANDIDATE_DIR/findrail" --candidate-sha "$CANDIDATE_SHA" --candidate-version "$CANDIDATE_VERSION" --alpha3-binary "$ALPHA3_BINARY" --alpha4-binary "$ALPHA4_BINARY" --evidence-fixture "$RUNNER_TEMP/evidence-collection-fixture" --report "$RUNNER_TEMP/packaged-journey-report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-browser-journey-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/packaged-journey-report.json
          if-no-files-found: error
          retention-days: 30
  aggregate-and-verify:
    needs: [validate-source, source-checks, native-packages, installed-vsix, packaged-browser-journey]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-package-${{ needs.validate-source.outputs.candidate_sha }}-*
          path: ${{ runner.temp }}/native
          merge-multiple: false
      - uses: actions/download-artifact@v8
        with:
          name: release-vsix-${{ needs.validate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/client
      - uses: actions/download-artifact@v8
        with:
          name: release-browser-journey-${{ needs.validate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/browser-record
      - name: Assemble exact set and verify all content
        env:
          VERSION: ${{ needs.validate-source.outputs.version }}
          CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset-input" "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/native" -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} "$RUNNER_TEMP/asset-input/" \;
          cp "$RUNNER_TEMP/client/findrail-readonly-0.1.0.vsix" "$RUNNER_TEMP/asset-input/"
          python3 scripts/release_assets.py assemble --input "$RUNNER_TEMP/asset-input" --output "$RUNNER_TEMP/release-assets" --version "$VERSION" --revision "$CANDIDATE_SHA"
          python3 scripts/release_assets.py verify --directory "$RUNNER_TEMP/release-assets" --version "$VERSION" --revision "$CANDIDATE_SHA"
          python3 scripts/candidate_record.py summary --native-directory "$RUNNER_TEMP/native" \
            --assets "$RUNNER_TEMP/release-assets" --browser-report "$RUNNER_TEMP/browser-record/packaged-journey-report.json" \
            --candidate-sha "$CANDIDATE_SHA" --candidate-version "$VERSION" --report "$RUNNER_TEMP/verification-summary.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ needs.validate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/release-assets/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: release-verification-${{ needs.validate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/verification-summary.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
  reusable-final-verification:
    needs: [validate-source, aggregate-and-verify]
    uses: ./.github/workflows/release-asset-verification.yml
    with:
      candidate_sha: ${{ needs.validate-source.outputs.candidate_sha }}
      candidate_version: ${{ needs.validate-source.outputs.version }}
  release-state:
    needs: [validate-source, reusable-final-verification]
    # Run the existing-release no-op check on previews too. Its token is
    # read-only; PR publication remains false and the publisher stays skipped.
    if: needs.validate-source.outputs.publish == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      decision: ${{ steps.decision.outputs.decision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.candidate_sha }}
          persist-credentials: false
      - id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-source.outputs.release_version }}
          CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          result=$(python3 scripts/release_gate.py --repository "$GITHUB_REPOSITORY" --version "$VERSION" --current-sha "$CANDIDATE_SHA")
          echo "decision=$result" >> "$GITHUB_OUTPUT"
  publish:
    needs: [validate-source, source-checks, native-packages, installed-vsix, packaged-browser-journey, aggregate-and-verify, reusable-final-verification, release-state]
    if: needs.validate-source.outputs.publish == 'true' && needs.release-state.outputs.decision == 'publish' && needs.validate-source.outputs.version == needs.validate-source.outputs.release_version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-assets-${{ needs.validate-source.outputs.candidate_sha }}
          path: ${{ runner.temp }}/release-assets
      - name: Recheck exact candidate and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-source.outputs.version }}
          CANDIDATE_SHA: ${{ needs.validate-source.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'Lephiziel/findrail'
          test "$GITHUB_REF" = 'refs/heads/main'
          if [[ "$GITHUB_EVENT_NAME" != push && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "Unsupported publisher event: $GITHUB_EVENT_NAME" >&2; exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python3 scripts/release_assets.py verify --directory "$RUNNER_TEMP/release-assets" --version "$VERSION" --revision "$CANDIDATE_SHA"
          TAG="v$VERSION"
          decision=$(python3 scripts/release_gate.py --repository "$GITHUB_REPOSITORY" --version "$VERSION" --current-sha "$CANDIDATE_SHA")
          if [[ "$decision" != publish ]]; then
            echo "Release/tag state changed after read-only gate ($decision); refusing to replace it." >&2; exit 1
          fi
          mapfile -t INSTALL_ASSETS < <(python3 - "$RUNNER_TEMP/release-assets/release-manifest.json" <<'PY'
          import json, sys
          manifest=json.load(open(sys.argv[1], encoding='utf-8'))
          print('\n'.join(sorted([item['basename'] for item in manifest['assets']] + ['release-manifest.json','SHA256SUMS.txt'])))
          PY
          )
          files=()
          for name in "${INSTALL_ASSETS[@]}"; do
            test -f "$RUNNER_TEMP/release-assets/$name"
            files+=("$RUNNER_TEMP/release-assets/$name")
          done
          gh release create "$TAG" "${files[@]}" --target "$CANDIDATE_SHA" --prerelease --title "Findrail $TAG" --notes-file docs/release-notes.md
