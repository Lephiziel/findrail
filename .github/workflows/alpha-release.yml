name: Alpha release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Read and validate version
        id: version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          version = pathlib.Path('build/package/VERSION').read_text().strip()
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+', version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
          PY
      - name: Check whether the prerelease already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build archives and license notices
        if: steps.existing.outputs.exists == 'false'
        run: python3 scripts/package.py
      - name: Smoke test the packaged Linux executable
        if: steps.existing.outputs.exists == 'false'
        run: |
          mkdir -p /tmp/findrail-release-smoke
          tar -xzf dist/*linux-amd64.tar.gz -C /tmp/findrail-release-smoke
          python3 scripts/smoke.py /tmp/findrail-release-smoke/*/findrail
      - name: Publish alpha archives
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: gh release create "$TAG" dist/* --target "$COMMIT" --prerelease --title "Findrail $TAG" --notes-file docs/release-notes.md
