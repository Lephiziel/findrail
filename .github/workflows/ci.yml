name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
      - name: Citation formatter tests
        run: node --test internal/transport/http/web/citation_test.mjs
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/findrail
      - name: Compiled alpha smoke (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/smoke.py ./findrail
      - name: Compiled alpha smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke.py ./findrail.exe
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Race detector
        run: go test -race ./...
      - name: Verify module checksums
        run: go mod verify
