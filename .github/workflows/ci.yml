name: CI
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      - name: Web UI regression tests
        run: node --test internal/transport/http/web/*_test.mjs
      - name: Packaging safety tests
        run: python3 scripts/test_package.py
      - name: Release asset contract tests
        run: python3 -m unittest scripts/test_release_assets.py scripts/test_release_gate.py scripts/test_packaged_journey.py scripts/test_smoke.py scripts/test_readiness.py
      - name: Performance and acceptance contract tests
        run: python3 -m unittest scripts/test_resource_series.py scripts/test_search_resource_check.py scripts/test_mixed_load_soak.py scripts/test_acceptance_kit.py scripts/test_manual_evidence.py scripts/test_alpha5_media.py
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
      - name: Build without CGO
        env:
          CGO_ENABLED: '0'
        run: go build ./cmd/findrail
      - name: Compiled alpha smoke (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/smoke.py ./findrail
      - name: Compiled alpha smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/smoke.py ./findrail.exe
      - name: Compiled search query smoke (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/search_smoke.py ./findrail
      - name: Compiled search query smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/search_smoke.py ./findrail.exe
      - name: Compiled MCP smoke (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/mcp_smoke.py ./findrail
      - name: Compiled MCP smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/mcp_smoke.py ./findrail.exe
      - name: Compiled portable snapshot smoke (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/portable_smoke.py ./findrail
      - name: Compiled portable snapshot smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/portable_smoke.py ./findrail.exe
      - name: Compiled indexing diagnostics smoke (Unix)
        if: runner.os != 'Windows'
        run: python3 scripts/diagnostics_smoke.py ./findrail
      - name: Compiled indexing diagnostics smoke (Windows)
        if: runner.os == 'Windows'
        run: python scripts/diagnostics_smoke.py ./findrail.exe
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: true
      - name: Formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Race detector
        run: go test -race ./...
      - name: Verify module checksums
        run: go mod verify
