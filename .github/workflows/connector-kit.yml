name: Connector kit
on:
  pull_request:
    paths:
      - 'pkg/connector/**'
      - 'examples/connectors/catalog/**'
      - 'internal/connectorcheck/**'
      - 'cmd/findrail-connector-check/**'
      - 'internal/devtools/connectorkit/**'
      - 'docs/connector-conformance.md'
      - 'docs/connectors.md'
      - 'CONTRIBUTING.md'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/connector-kit.yml'
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Build connector check (Unix)
        if: ${{ runner.os != 'Windows' }}
        run: go build -o "$RUNNER_TEMP/findrail-connector-check" ./cmd/findrail-connector-check
      - name: Run connector check (Unix)
        if: ${{ runner.os != 'Windows' }}
        run: |
          "$RUNNER_TEMP/findrail-connector-check" --repo-root "$GITHUB_WORKSPACE"
      - name: Build connector check (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: go build -o "$env:RUNNER_TEMP/findrail-connector-check.exe" ./cmd/findrail-connector-check
      - name: Run connector check (Windows)
        if: ${{ runner.os == 'Windows' }}
        run: '& "$env:RUNNER_TEMP/findrail-connector-check.exe" --repo-root "$env:GITHUB_WORKSPACE"'
