name: Voluntary desktop first-run report
description: Optional manual Windows or Apple Silicon first-run observations
title: "[Manual first run] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: >
        Optional manual feedback for the verified release kit linked from
        https://github.com/Lephiziel/findrail/releases. Automated CI/native
        testing is not a manual Windows or Finder experience. Do not provide
        private paths, documents, queries, logs, device identifiers, or credentials.
        A local private report is fine; public issue submission is optional.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows (windows-amd64), Apple Silicon (darwin-arm64)]
    validations:
      required: true
  - type: input
    id: identity
    attributes:
      label: Version, candidate SHA, and download source
      description: Include what you know. Unknown candidate SHA is okay for qualitative feedback.
    validations:
      required: true
  - type: input
    id: archive_sha256
    attributes:
      label: Archive SHA-256 (if available)
      description: Compare with the published SHA256SUMS.txt; do not guess.
  - type: textarea
    id: cases
    attributes:
      label: Manual cases
      description: For each item note passed, failed, or not run and actual elapsed seconds if known; otherwise say unknown. Describe obstacles without private details.
      value: |
        install:
        launch:
        repeat-launch:
        retrieval:
        collection-restart:
        refresh:
        quit:
        uninstall-data-preserved:
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: Optional obstacle or notes
      description: Do not include private content, paths, logs, or queries.
